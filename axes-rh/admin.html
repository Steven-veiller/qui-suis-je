<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Back-office Axès RH</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Oswald:wght@500;600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
<style>
:root{--violet:#9b3ccf;--teal:#2ebfa5;--turq:#7fd1c9;--pink:#e2588f;--taupe:#a68b82;--choc:#4a2c25;--grad:linear-gradient(120deg,#a83fd0,#6f7fe0 50%,#2ebfa5)}
:root{color-scheme:light dark;--bg:light-dark(#fcf8f7,#1d1412);--card:light-dark(#fff,#2a1d1a);--ink:light-dark(#3a2420,#f7ece8);--mute:light-dark(#7d6660,#c4aea7);--line:light-dark(#efe2de,#45322d);--tint:light-dark(#ecf8f6,#21302d);--soft:light-dark(#fdf0f5,#3a2229)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'Nunito Sans',system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Outfit,system-ui,sans-serif;margin:0;line-height:1.1}
.wrap{max-width:1100px;margin:0 auto;padding:0 max(4vw,16px)}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header .wrap{display:flex;align-items:center;gap:14px;min-height:66px;flex-wrap:wrap;padding-block:8px}
header img{height:42px}
header h1{font-size:20px;flex:1}
.live{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:8px}
.live i{width:9px;height:9px;border-radius:50%;background:var(--teal);animation:bl 2s infinite}
@keyframes bl{50%{opacity:.3}}
button,.btn{min-height:44px;padding:10px 18px;border-radius:14px;border:0;font:600 15px Outfit,sans-serif;cursor:pointer;background:var(--grad);color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
button.ghost,.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.login{max-width:420px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:30px;text-align:center;box-shadow:0 20px 50px -30px rgba(74,44,37,.4)}
.login img{height:90px;margin-bottom:12px}
.login input{width:100%;font:600 20px Oswald,sans-serif;letter-spacing:.12em;text-align:center;text-transform:uppercase;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);margin:16px 0 12px}
.err{color:var(--pink);font-weight:700;min-height:1.5em}
main{padding:24px 0 60px}
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:24px;box-shadow:0 16px 40px -30px rgba(74,44,37,.45)}
.ring{width:132px;height:132px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:600 34px Oswald,sans-serif}
.badge{display:inline-block;padding:5px 14px;border-radius:999px;font-weight:800;font-size:14px;color:#fff}
.hero h2{font-size:clamp(26px,4vw,36px);margin:8px 0 12px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.kv div{background:var(--bg);border-radius:14px;padding:10px 14px}
.kv small{display:block;color:var(--mute);font-size:13px}
.kv b{font:600 17px Outfit,sans-serif}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
.sel{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.sel button{font-size:14px}
.sel button[aria-pressed=false]{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:20px}
.card h3{font-size:20px;margin-bottom:12px}
details{border-top:1px solid var(--line);padding:12px 0}
details:first-of-type{border-top:0}
summary{cursor:pointer;font:600 17px Outfit,sans-serif;display:flex;justify-content:space-between;gap:10px;list-style:none;min-height:30px}
summary::-webkit-details-marker{display:none}
summary span{font:500 14px Oswald,sans-serif;color:var(--mute);white-space:nowrap}
summary span.full{color:var(--teal)}
.qa{padding:12px 0 4px 14px;border-left:3px solid var(--line);margin:10px 0 0 4px}
.qa.on{border-left-color:var(--turq)}
.qa .l{font-weight:700}
.qa .v{white-space:pre-wrap;margin:4px 0;overflow-wrap:anywhere}
.qa .t{font-size:13px;color:var(--mute)}
.qa .none{color:var(--mute);font-style:italic}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.tl li:first-child{border-top:0}
.tl time{font:500 14px Oswald,sans-serif;color:var(--mute);white-space:nowrap}
.tl .d{display:block;font-size:12px;color:var(--mute)}
.tl em{font-style:normal;font-weight:700}
.fl{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.fl li{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:14px}
.fl .ic{flex:none;width:42px;height:42px;border-radius:11px;background:var(--grad);color:#fff;display:grid;place-items:center;font:600 11px Oswald,sans-serif}
.fl .n{flex:1;overflow-wrap:anywhere;font-weight:700}.fl .n small{display:block;font-weight:400;color:var(--mute);font-size:13px}
.fl a{flex:none;min-height:40px;padding:8px 14px;font-size:14px}
.empty{color:var(--mute);font-style:italic}
.toast{position:fixed;bottom:20px;left:50%;translate:-50% 0;background:var(--choc);color:#fff;padding:12px 20px;border-radius:14px;font-weight:700;z-index:9}
[hidden]{display:none!important}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
@media(max-width:560px){.hero{grid-template-columns:1fr;justify-items:start}.ring{width:104px;height:104px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="loginv" class="login" hidden>
<img src="logo.webp" alt="Axès RH">
<h2>Back-office du questionnaire</h2>
<form id="lf"><input id="code" autocomplete="off" placeholder="Code d'accès" aria-label="Code d'accès"><button type="submit" style="width:100%;justify-content:center">Entrer</button></form>
<p class="err" id="err"></p>
</div>
<div id="appv" hidden>
<header><div class="wrap"><img src="logo.webp" alt="Axès RH"><h1>Suivi du questionnaire d'Angélique</h1><span class="live" id="live"><i></i>En direct</span><button class="ghost" id="refresh">Actualiser</button><button class="ghost" id="logout">Quitter</button></div></header>
<main class="wrap" id="main"></main>
</div>
<script>
{
const FN="https://zciaxnppinswrjyhzrue.supabase.co/functions/v1/axes-admin";
const KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpjaWF4bnBwaW5zd3JqeWh6cnVlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4ODQwMDksImV4cCI6MjEwNzQ2MDAwOX0.LK9h6gbMApv-Bzf1d3x1QYVlxxVJar42lz7d_irDMvc";
const STEPS=["Toi","Ta semaine","Tes envies","Formations","Admin","Clients","Com & site","Outils","Idées","L'outil idéal","Documents"];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=t=>t?new Date(t).toLocaleString("fr-FR",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"—";
const hm=t=>new Date(t).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
const day=t=>new Date(t).toLocaleDateString("fr-FR",{day:"numeric",month:"short"});
function ago(t){if(!t)return"";const s=(Date.now()-new Date(t))/1000;if(s<60)return"à l'instant";if(s<3600)return`il y a ${Math.round(s/60)} min`;if(s<86400)return`il y a ${Math.round(s/3600)} h`;return`il y a ${Math.round(s/86400)} j`}
let code="",data=null,sel=0,timer=null;
try{code=localStorage.getItem("axes-admin")||""}catch(e){}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}

async function load(){
try{const r=await fetch(FN,{method:"POST",headers:{"Content-Type":"application/json",apikey:KEY},body:JSON.stringify({code})});
if(r.status===401){showLogin("Code incorrect.");return}
const j=await r.json();if(j.error)throw new Error(j.error);data=j;$("loginv").hidden=true;$("appv").hidden=false;render();
$("live").lastChild.textContent=" Mis à jour à "+hm(j.now)}catch(e){if(!data)showLogin("Connexion impossible pour le moment, réessaie.");else $("live").lastChild.textContent=" Hors ligne, nouvel essai bientôt"}}
function showLogin(m){$("appv").hidden=true;$("loginv").hidden=false;$("err").textContent=m||"";$("code").value=code}

function status(s){if(s.finals.length)return["Envoyé","var(--teal)"];if(!s.opened&&!s.flat.some(f=>f.v))return["A ouvert le lien, pas encore commencé","var(--taupe)"];if(Date.now()-new Date(s.last)<5*60000)return["En train de répondre","var(--pink)"];return["En cours","var(--violet)"]}

function lastVisit(s){const v=(s.visits||[]).filter(x=>x[0]!=="leave");return v.length?v[v.length-1][1]:s.first}
function textOf(s){let o="# Questionnaire Axès RH — réponses d'Angélique\n";let st=-1;for(const f of s.flat){if(f.s!==st){st=f.s;o+=`\n## ${f.st}\n`}o+=`\n**${f.l}**\n${f.v||"(pas de réponse)"}\n`}return o}

function render(){
const m=$("main");const L=data.sessions;
if(!L.length){m.innerHTML=`<div class="card" style="margin-top:20px"><h3>Pas encore de réponse</h3><p class="empty">Angélique n'a pas encore ouvert le questionnaire. Dès qu'elle commence, tout s'affiche ici en direct.</p></div>`;return}
if(sel>=L.length)sel=0;const s=L[sel];
const [lab,col]=status(s);const answered=s.flat.filter(f=>f.v).length,total=s.flat.length;
const C=2*Math.PI*52,off=C*(1-(s.pct||0)/100);
const ev=[];
for(const [k,t] of (s.visits||[]))ev.push([t,k==="open"?"<em>A ouvert le lien</em>":k==="back"?"Est revenue sur la page":"A quitté la page"]);
if(s.opened)ev.push([s.opened,"A cliqué sur « Commencer le parcours »"]);
for(const [i,t] of Object.entries(s.steps||{}))if(+i>0)ev.push([t,+i<STEPS.length?`Arrivée à l'étape ${+i+1} · ${STEPS[+i]||""}`:"Arrivée au récapitulatif"]);
for(const f of s.flat)if(f.t)ev.push([f.t.first,`A répondu : <em>${esc(f.l)}</em>`]);
for(const f of s.files)if(f.at)ev.push([f.at,`A déposé : <em>${esc(f.n)}</em>`]);
for(const t of s.finals)ev.push([t,"<em>A envoyé ses réponses</em>"]);
ev.sort((a,b)=>a[0]<b[0]?1:-1);
const steps=[];for(const f of s.flat){(steps[f.s]=steps[f.s]||{t:f.st,q:[]}).q.push(f)}
const notif=(s.notifs||[])[0];
m.innerHTML=`${L.length>1?`<div class="sel">${L.map((x,i)=>`<button data-sel="${i}" aria-pressed="${i===sel}">Appareil ${L.length-i} · ${esc(ago(x.last))}</button>`).join("")}</div>`:""}
<section class="hero"><div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--line)" stroke-width="12"/><circle cx="60" cy="60" r="52" fill="none" stroke="url(#g)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"/><defs><linearGradient id="g"><stop offset="0" stop-color="#a83fd0"/><stop offset="1" stop-color="#2ebfa5"/></linearGradient></defs></svg><b>${s.pct||0}%</b></div>
<div><span class="badge" style="background:${col}">${lab}</span><h2>${s.finals.length?"Angélique a envoyé ses réponses":`Étape ${Math.min((s.cur||0)+1,STEPS.length)} · ${esc(STEPS[s.cur]||"Récap")}`}</h2>
<div class="kv"><div><small>Première ouverture du lien</small><b>${fmt(((s.visits||[]).find(v=>v[0]==="open")||[])[1]||s.first)}</b></div><div><small>Dernière visite</small><b>${esc(ago(lastVisit(s)))}</b><small>${fmt(lastVisit(s))} · ${(s.visits||[]).filter(v=>v[0]!=="leave").length} visite(s)</small></div><div><small>Commencé</small><b>${s.opened?fmt(s.opened):"Pas encore"}</b></div><div><small>Dernière activité</small><b>${esc(ago(s.last))}</b><small>${fmt(s.last)}</small></div><div><small>Questions remplies</small><b>${answered} / ${total}</b></div><div><small>Envoyé</small><b>${s.finals.length?fmt(s.finals[s.finals.length-1]):"Pas encore"}</b>${notif?`<small>Alerte mail : ${/formsubmit 200/.test(notif.statut)?"partie":esc(notif.statut.slice(0,60))}</small>`:""}</div><div><small>Fichiers</small><b>${s.files.length}</b></div></div></div></section>
<div class="tools"><button id="copy">Copier toutes les réponses</button><button class="ghost" id="json">Télécharger en JSON</button><button class="ghost" id="txt">Télécharger en texte</button></div>
<div class="grid"><div>
<div class="card"><h3>Réponses par étape</h3>${steps.map((st,i)=>{if(!st)return"";const n=st.q.filter(q=>q.v).length;return `<details${i===(s.cur||0)?" open":""}><summary>${i+1}. ${esc(st.t)}<span class="${n===st.q.length?"full":""}">${n} / ${st.q.length}</span></summary>${st.q.map(q=>`<div class="qa${q.v?" on":""}"><div class="l">${esc(q.l)}</div>${q.v?`<div class="v">${esc(q.v)}</div><div class="t">Répondu ${fmt(q.t&&q.t.first)}${q.t&&q.t.last!==q.t.first?` · modifié ${fmt(q.t.last)}`:""}</div>`:`<div class="none">Pas encore répondu</div>`}</div>`).join("")}</details>`}).join("")}</div>
</div><div>
<div class="card"><h3>Fichiers envoyés</h3>${s.files.length?`<ul class="fl">${s.files.map(f=>`<li><span class="ic">${esc((f.n.split(".").pop()||"").slice(0,4).toUpperCase())}</span><span class="n">${esc(f.n)}<small>${esc(f.label)}${f.at?" · "+fmt(f.at):""}${f.size?" · "+Math.max(1,Math.round(f.size/1024))+" Ko":""}</small></span>${f.url&&/^https:\/\//.test(f.url)?`<a class="btn" href="${esc(f.url)}">Télécharger</a>`:`<small class="empty">${f.stored?"lien indisponible":"non reçu"}</small>`}</li>`).join("")}</ul>`:`<p class="empty">Aucun fichier pour l'instant.</p>`}</div>
<div class="card"><h3>Chronologie</h3>${ev.length?`<ul class="tl">${ev.slice(0,80).map(([t,x])=>`<li><time>${hm(t)}<span class="d">${day(t)}</span></time><span>${x}</span></li>`).join("")}</ul>`:`<p class="empty">Rien pour l'instant.</p>`}</div>
</div></div>`;
}

function dl(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
document.addEventListener("click",async e=>{const t=e.target.closest("button");if(!t)return;
if(t.dataset.sel){sel=+t.dataset.sel;render();return}
const s=data&&data.sessions[sel];
if(t.id==="refresh"){load();return}
if(t.id==="logout"){try{localStorage.removeItem("axes-admin")}catch(_){}code="";clearInterval(timer);showLogin("");return}
if(t.id==="copy"&&s){try{await navigator.clipboard.writeText(textOf(s));toast("Réponses copiées")}catch(_){dl("reponses-angelique.md",textOf(s),"text/markdown")}return}
if(t.id==="json"&&s){dl("reponses-angelique.json",JSON.stringify(s,null,2),"application/json");return}
if(t.id==="txt"&&s){dl("reponses-angelique.md",textOf(s),"text/markdown");return}
});
$("lf").addEventListener("submit",e=>{e.preventDefault();code=$("code").value.trim().toUpperCase();try{localStorage.setItem("axes-admin",code)}catch(_){}load();clearInterval(timer);timer=setInterval(load,30000)});
if(code){load();timer=setInterval(load,30000)}else showLogin("");
}
</script>
</body>
</html>
